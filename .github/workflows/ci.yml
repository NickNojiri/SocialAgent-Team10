name: CI

on:
  push:
  pull_request:

# A newer push to the same branch makes the older run pointless: cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The offline suite takes ~1 min; anything near this limit is a hang, not slowness.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Run offline tests (full suite)
        run: python -m pytest -k "not live" -q

      # Track D's attack report (feature #12): "N attacks, M refused, K got through" per
      # class. Fails on any new attack that gets through; the 8 open Track A findings are
      # xfail(strict), so fixing one also fails here until its mark is removed.
      - name: Security attack report
        run: python scripts/bench_security_attacks.py

      # The accuracy scorecard (AGENTS.md "Checks"), printed so every PR shows the
      # numbers next to the diff. It reads DEV, never test: printing test on every
      # push made each PR's keep-or-drop decision a look at the held-out set
      # (docs/DATA_PLAN.md). Informational: the floors that can fail CI live in
      # test_extraction_labels.py.
      - name: Accuracy scorecard (dev split)
        run: python -m src.ingestion.eval --offline --split dev
