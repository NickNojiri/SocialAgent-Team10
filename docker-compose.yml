version: "3.8"

services:

  # The Discord bot (thin client — capture/votes go to the admin app on the host)
  discord-bot:
    build: ./app
    container_name: event-bot
    env_file: .env
    environment:
      - INGEST_URL=${INGEST_URL:-http://host.docker.internal:8010}
      - ADMIN_URL=${ADMIN_URL:-http://host.docker.internal:8010}
    depends_on:
      - recommend
    networks:
      - event-net
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach Ollama + admin app on host

  # Recommendation service: /recommend + /plan over the per-guild Chroma catalogs
  recommend:
    build:
      context: .
      dockerfile: recommend/Dockerfile
    container_name: event-recommend
    env_file: .env
    networks:
      - event-net
    ports:
      - "8003:8003"
    volumes:
      - ./data:/app/data   # same Chroma store the admin app populates
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach Ollama on host
    healthcheck:
      test: python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  event-net:
    driver: bridge
