[pytest]
testpaths = .
# scripts/ holds runnable CLI demos named test_*.py (manual transcribe/plan
# tools), not unit tests — keep pytest from collecting them. experiments/ holds research
# scripts that read data/ (gitignored); experiments/burner_study/alias_test.py matched
# pytest's *_test.py pattern and broke collection. Their tests live at the root.
addopts = --ignore=scripts --ignore=experiments
markers =
    live: marks tests as requiring live network access. (Run offline tests via `pytest -k "not live"`)
